<!doctype html>
<html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);background:var(--body)}
button{font:inherit;color:inherit;cursor:pointer}button:focus-visible,[role=button]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#work{height:100%;display:flex;min-width:0}#editor{display:none;position:relative;min-width:100px;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--body)}
body.edit #editor{display:flex;flex-direction:column;width:var(--split)}#code,#syntax{margin:0;font:13px/20px ui-monospace,"SF Mono",Menlo,Consolas,monospace;tab-size:4;white-space:pre}#syntax{position:absolute;inset:0;padding:40px 14px 16px;overflow:hidden;pointer-events:none}#code{position:absolute;inset:0;z-index:1;height:100%;caret-color:var(--text);resize:none;flex:1;min-height:0;width:100%;padding:40px 14px 16px;border:0;outline:0;background:transparent;color:transparent;font:13px/20px ui-monospace,"SF Mono",Menlo,Consolas,monospace;tab-size:4;white-space:pre;overflow:auto}
.round{position:absolute;z-index:2;top:8px;width:24px;height:24px;padding:0;border:1px solid var(--border);border-radius:50%;background:var(--body);line-height:20px}.round:hover{background:var(--hover)}#copy{right:38px}#close{right:8px;font-size:18px}
#divider{display:none;flex:none;width:14px;cursor:col-resize;position:relative;touch-action:none}body.edit #divider{display:block}#divider:after{content:"";position:absolute;top:16px;bottom:16px;left:6px;width:2px;background:var(--border);border-radius:2px}#divider:hover:after{background:var(--accent)}body.drag iframe{pointer-events:none}
#preview{flex:1;min-width:0;position:relative;overflow:hidden}iframe{border:0;width:100%;height:100%;display:block;background:white}#welcome{height:100%;padding:24px;border:1px solid var(--border);border-radius:8px;background:var(--panel);display:flex;flex-direction:column;gap:16px}h1{font-size:20px;line-height:27px;font-weight:650;margin:0}p{margin:0;color:var(--muted);font-size:16px;line-height:24px;font-weight:300}#drop{flex:1;min-height:120px;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:20px;border:1px dashed var(--border);border-radius:8px;background:var(--body);cursor:pointer}#drop.active{border-color:var(--accent);background:var(--hover)}#plus{height:64px;width:72px;display:grid;place-items:center;border:1px dashed var(--muted);border-radius:22px;transform:rotate(-20deg);font-size:44px;font-weight:200;color:var(--muted)}#drop span:last-child{color:var(--muted);font-size:16px;font-weight:300;text-align:center}
#full{position:absolute;z-index:4;top:10px;right:10px;border:1px solid var(--border);border-radius:8px;background:var(--body);height:28px;padding:0 10px;font-size:12px;opacity:0}#full:hover,#full:focus-visible,#preview:hover #full{opacity:1}
#menu{position:absolute;z-index:5;right:6px;bottom:6px;display:flex;gap:4px;align-items:center}#toggle{border:1px solid var(--border);background:var(--body);border-radius:50%;width:30px;height:30px;font-size:18px;opacity:0}#menu:hover #toggle,#menu:focus-within #toggle,#menu.open #toggle{opacity:1}#actions{display:none;gap:4px}#menu.open #actions,#menu:focus-within #actions{display:flex}.action{border:0;border-radius:5px;background:var(--hover);color:var(--accent);height:24px;padding:0 8px;font-size:12px;font-weight:500}
body.readonly #editor,body.readonly #divider,body.readonly #menu{display:none}body.full #full{display:none}#error{position:absolute;bottom:44px;right:12px;max-width:90%;padding:6px 10px;border:1px solid var(--border);border-radius:5px;background:var(--body);color:var(--muted);font-size:12px}#error:empty{display:none}
</style></head><body><div id="work"><section id="editor"><button id="copy" class="round" aria-label="Copy all HTML">▢</button><button id="close" class="round" aria-label="Close editor">×</button><pre id="syntax" aria-hidden="true"></pre><textarea id="code" spellcheck="false" autocomplete="off" autocapitalize="off" aria-label="HTML"></textarea></section><div id="divider" role="separator" aria-orientation="vertical" tabindex="0"></div><section id="preview"><div id="welcome"><h1></h1><p></p><div id="drop" role="button" tabindex="0"><span id="plus">＋</span><span></span></div></div><iframe title="HTML" sandbox="allow-scripts allow-forms" referrerpolicy="no-referrer"></iframe><button id="full"></button><div id="menu"><div id="actions"><button id="edit" class="action"></button><button id="upload" class="action"></button></div><button id="toggle" aria-expanded="false">☰</button></div><div id="error" role="status"></div></section></div>
<script>
(()=>{'use strict';
const nonce=__QUIET_NONCE__, $=id=>document.getElementById(id), frame=document.querySelector('iframe'), code=$('code');
let state={},rendered=null,edit=false,split=.5,timer,drag=null,epoch=0,revision=0,composing=false,pending=null;
const send=(type,data={})=>window.ipc.postMessage(JSON.stringify({nonce,type,...data}));
const tr=(zh,en)=>state.english?en:zh;
function layout(){document.documentElement.style.setProperty('--split',(split*100)+'%')}
function preview(){if(rendered===state.source)return;rendered=state.source;
 const empty=!state.source.trim();$('welcome').hidden=!empty;frame.hidden=empty;
 $('welcome').style.display=empty?'flex':'none';frame.style.display=empty?'none':'block';
 if(empty){frame.removeAttribute('srcdoc');return}
 const doc=new DOMParser().parseFromString(state.source,'text/html');
 const csp=doc.createElement('meta');csp.httpEquiv='Content-Security-Policy';csp.content="default-src https: http: data: blob: 'unsafe-inline' 'unsafe-eval'; object-src 'none'; base-uri 'none'; form-action https: http:";doc.head.prepend(csp);
 const script=doc.createElement('script');script.textContent=`(()=>{let last=0;function report(){const body=document.body;if(!body)return;const style=getComputedStyle(body);const h=Math.ceil(Math.max(body.scrollHeight,body.offsetHeight)+(parseFloat(style.marginTop)||0)+(parseFloat(style.marginBottom)||0));if(h!==last){last=h;parent.postMessage({quietHtml:'height',height:h},'*')}}addEventListener('load',()=>{new ResizeObserver(report).observe(document.body);report()});addEventListener('keydown',e=>{if(e.key==='Escape')parent.postMessage({quietHtml:'escape'},'*')});addEventListener('wheel',e=>{if(e.ctrlKey||e.metaKey)return;let el=e.target;while(el&&el!==document.documentElement){const style=getComputedStyle(el);if(/auto|scroll/.test(style.overflowY)&&el.scrollHeight>el.clientHeight&&((e.deltaY<0&&el.scrollTop>0)||(e.deltaY>0&&el.scrollTop+el.clientHeight<el.scrollHeight-1)))return;el=el.parentElement}const root=document.scrollingElement;if(root&&((e.deltaY<0&&root.scrollTop>0)||(e.deltaY>0&&root.scrollTop+root.clientHeight<root.scrollHeight-1)))return;e.preventDefault();parent.postMessage({quietHtml:'scroll',dy:e.deltaY},'*')},{passive:false})})()`;
 doc.head.prepend(script);frame.srcdoc='<!doctype html>'+doc.documentElement.outerHTML;
}
window.quietHtml=next=>{if(next.epoch<epoch)return;if(composing){pending=next;return}if(next.epoch>epoch){epoch=next.epoch;revision=0}
 // Apply chrome updates while an older source echo waits for the latest local edit.
 state=next.revision<revision?{...next,source:state.source,syntax:[{text:state.source}]}:next;for(const[k,v]of Object.entries(state.colors))document.documentElement.style.setProperty('--'+k,v);
 document.body.classList.toggle('readonly',state.readOnly);document.body.classList.toggle('full',state.full);document.body.classList.toggle('edit',edit&&!state.readOnly);
 split=state.split;layout();if(code.value!==state.source){const start=code.selectionStart,end=code.selectionEnd;code.value=state.source;if(document.activeElement===code)code.setSelectionRange(Math.min(start,code.value.length),Math.min(end,code.value.length))}
 const fragments=(state.syntax||[{text:state.source}]).map(token=>{const span=document.createElement('span');span.textContent=token.text;if(token.color)span.style.color=token.color;if(token.italic)span.style.fontStyle='italic';return span});$('syntax').replaceChildren(...fragments);$('syntax').scrollTop=code.scrollTop;$('syntax').scrollLeft=code.scrollLeft;
 code.readOnly=state.readOnly;code.placeholder=tr('请输入完整 HTML，可包含 <style>/<script>','Enter full HTML, including <style>/<script>');
 $('welcome').querySelector('h1').textContent=tr('欢迎使用 HTML 块','Welcome to HTML block');$('welcome').querySelector('p').textContent=tr('HTML 块是文档中的网页展示工具，可以让你在文档中开发和展示网页。','Display webpages and develop interactive content in your document.');
 $('drop').lastElementChild.textContent=tr('拖拽 HTML 文件到这里，或点击上传','Drop an HTML file here, or click to upload');$('drop').tabIndex=state.readOnly?-1:0;
 $('edit').textContent=tr('编辑','Edit');$('upload').textContent=tr('上传','Upload');$('full').textContent=tr('全屏','Fullscreen');$('full').title=tr('进入全屏','Enter fullscreen');
 $('copy').title=$('copy').ariaLabel=tr('复制全部 HTML','Copy all HTML');$('close').title=$('close').ariaLabel=tr('关闭编辑','Close editor');$('toggle').ariaLabel=tr('打开 HTML 块操作菜单','Open HTML block actions');$('divider').ariaLabel=tr('调整编辑区宽度','Resize editor panel');
 $('error').textContent=state.error||'';preview();
};
const change=()=>{if(state.readOnly)return;const source=code.value;if(new TextEncoder().encode(source).length>state.maxBytes){$('error').textContent=tr('HTML 不能超过 8 MB','HTML must be 8 MB or smaller');return}state.source=source;$('syntax').textContent=source;if(composing)return;send('source',{source,epoch,revision:++revision});clearTimeout(timer);timer=setTimeout(preview,150)};
code.addEventListener('compositionstart',()=>{composing=true});code.addEventListener('compositionend',()=>{composing=false;change();if(pending){const next=pending;pending=null;window.quietHtml(next)}});
code.addEventListener('scroll',()=>{$('syntax').scrollTop=code.scrollTop;$('syntax').scrollLeft=code.scrollLeft});code.addEventListener('input',change);code.addEventListener('keydown',e=>{if(composing||e.isComposing)return;if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='z'){e.preventDefault();send(e.shiftKey?'redo':'undo')}if(e.key==='Tab'){e.preventDefault();document.execCommand('insertText',false,'    ')}});
$('edit').onclick=()=>{edit=true;document.body.classList.add('edit');$('menu').classList.remove('open');code.focus();send('editing',{edit:true})};$('close').onclick=()=>{edit=false;document.body.classList.remove('edit');send('editing',{edit:false})};
$('toggle').onclick=()=>{const on=$('menu').classList.toggle('open');$('toggle').setAttribute('aria-expanded',String(on))};$('full').onclick=()=>send('fullscreen');$('upload').onclick=()=>send('upload');$('drop').onclick=()=>{if(!state.readOnly)send('upload')};$('drop').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();$('drop').click()}};$('copy').onclick=()=>send('copy');
async function drop(e){e.preventDefault();$('drop').classList.remove('active');if(state.readOnly)return;const f=e.dataTransfer?.files?.[0];if(!f)return;if(!/\.html?$/i.test(f.name)||f.size>state.maxBytes){$('error').textContent=tr('请选择 .html 或 .htm 文件（不超过 8 MB）','Choose an .html or .htm file (up to 8 MB)');return}try{code.value=await f.text();change()}catch{$('error').textContent=tr('HTML 文件读取失败','Could not read HTML file')}}
document.addEventListener('dragover',e=>{e.preventDefault();if(!state.readOnly)$('drop').classList.add('active')});document.addEventListener('dragleave',()=>{$('drop').classList.remove('active')});document.addEventListener('drop',drop);
$('divider').onpointerdown=e=>{drag=e.pointerId;$('divider').setPointerCapture(drag);document.body.classList.add('drag')};$('divider').onpointermove=e=>{if(drag===null)return;split=Math.max(.2,Math.min(.8,e.clientX/innerWidth));layout()};$('divider').onpointerup=()=>{drag=null;document.body.classList.remove('drag');send('split',{split})};$('divider').onpointercancel=$('divider').onpointerup;$('divider').onkeydown=e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();split=Math.max(.2,Math.min(.8,split+(e.key==='ArrowLeft'?-.02:.02)));layout();send('split',{split})}};
addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();if(edit){$('close').click()}else send('escape')}});
addEventListener('wheel',e=>{if(e.target===code||e.ctrlKey||e.metaKey)return;e.preventDefault();send('scroll',{dy:e.deltaY})},{passive:false});
addEventListener('message',e=>{if(e.source!==frame.contentWindow)return;const d=e.data;if(d?.quietHtml==='height'&&Number.isFinite(d.height))send('height',{height:d.height});if(d?.quietHtml==='scroll'&&Number.isFinite(d.dy))send('scroll',{dy:d.dy});if(d?.quietHtml==='escape')send('escape')});
window.quietHtml(__QUIET_STATE__);send('ready');
})();
</script></body></html>

  .brand img { width: 30px; height: 30px; }
  .pill-link {

    backdrop-filter: blur(14px) saturate(1.4); -webkit-backdrop-filter: blur(14px) saturate(1.4);
    transition: background .15s;
  }
  .pill-link:hover { background: rgba(255, 255, 255, .85); }
  .pill-link svg { width: 16px; height: 16px; }

  header { text-align: center; padding: clamp(8px, 3.2vh, 40px) 16px 0; }
  .badge {
    display: inline-flex; align-items: center; gap: 8px; height: 28px; padding: 0 12px 0 4px; border-radius: 999px;
    font-size: 13px; font-weight: 550; color: var(--ink-2);
    background: var(--glass); border: 1px solid var(--glass-line);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);

  .badge b { padding: 2px 8px; border-radius: 999px; background: #2f7d4f; color: #fff; font-size: 12px; font-weight: 600; }

  .actions { display: flex; justify-content: center; flex-wrap: wrap; gap: 12px; margin-top: clamp(18px, 3vh, 30px); }
  .dl {

    text-decoration: none; text-align: left; transition: transform .15s, box-shadow .15s, background .15s;
  }
  .dl:hover { transform: translateY(-1px); }
  .dl svg { width: 22px; height: 22px; flex: none; }
  .dl small { display: block; font-size: 11.5px; font-weight: 500; opacity: .7; line-height: 1.2; }
  .dl strong { display: block; font-size: 17px; font-weight: 650; line-height: 1.25; letter-spacing: -.01em; }

  .dl.win svg { color: #0078d4; }

  .more { display: flex; justify-content: center; flex-wrap: wrap; gap: 4px 18px; margin: 14px 0 0; font-size: 13px; font-weight: 550; }

function detect() {
  const q = new URLSearchParams(location.search).get("lang");
  if (q && T[q]) return q;
  try { const saved = localStorage.getItem("lang"); if (saved && T[saved]) return saved; } catch {}
  for (const l of navigator.languages || [navigator.language]) {
    const v = (l || "").toLowerCase();
    if (/^zh-(tw|hk|mo|hant)/.test(v)) return "zh-Hant";
    if (v.startsWith("zh")) return "zh-Hans";
    if (v.startsWith("ja")) return "ja";
    if (v.startsWith("en")) return "en";
  }
  return "en";
}
function apply(lang) {
  const t = T[lang];
  document.documentElement.lang = lang === "zh-Hans" ? "zh-CN" : lang === "zh-Hant" ? "zh-Hant" : lang;
  document.title = t.doc;
  document.querySelector('meta[name="description"]').content = t.desc;
  document.querySelectorAll("[data-i18n]").forEach(e => e.textContent = t[e.dataset.i18n]);
  document.querySelectorAll("[data-i18n-html]").forEach(e => e.innerHTML = t[e.dataset.i18nHtml]);
  document.getElementById("shot").alt = t.alt;
  document.getElementById("lang").value = lang;
}
apply(detect());
document.getElementById("lang").addEventListener("change", e => {
  apply(e.target.value);
  try { localStorage.setItem("lang", e.target.value); } catch {}
});

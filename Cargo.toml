[package]
name = "quiet_md"
version = "0.1.14"
edition = "2024"
description = "A fast, local-first rich text notes app for macOS and Windows, drawn with GPUI and compatible with Feishu DocxXML"
license = "MIT"
readme = "README.md"
authors = ["s1dashu"]
keywords = ["notes", "markdown", "editor", "gpui", "local-first"]
categories = ["text-editors"]

# `devtools`: the FDL_SCRIPT driver for tools/harness (`cargo build --release
# --features devtools`). Off in release builds: shipped apps cannot be scripted.
[features]
devtools = ["embed-xiaolai"]
# `embed-xiaolai`: the board's CJK font (14 MB) compiled in instead of fetched
# when first needed (src/font_downloads.rs). On with `devtools`, so harness
# screenshots never depend on the network; off in shipped builds.
embed-xiaolai = []

# `fdl_core` is the GPUI-free document engine; plain `cargo test` covers both.
[workspace]
members = ["crates/core", "crates/cli", "vendor/xim-ctext"]
# vendor/zed holds path dependencies with self-contained manifests, not members.
# vendor/xim-ctext is a member so its tests run (vendor/xim-ctext/README.md).
exclude = ["vendor", "tools/vendor-sync"]
default-members = [".", "crates/core", "crates/cli"]

[dependencies]
fdl_core = { path = "crates/core" }
anyhow = "1.0.104"
async-lock = "3.4"
dirs = "7.0.0"
gpui = { path = "vendor/zed/crates/gpui" }
quick-xml = "0.37"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
unicode-segmentation = "1.13.3"
uuid = { version = "1.28.0", features = ["v4"] }
image = { version = "0.25", default-features = false, features = ["png", "tiff"] }
raw-window-handle = "0.6"
rustc-hash = "2.1"
web-time = { version = "1", features = ["serde"] }
katex-rs = { version = "0.3", default-features = false }
regex = "1"
html5ever = "0.27"
markup5ever_rcdom = "0.3"
base64 = "0.22"
# the board's 复制为 PNG rasterizes its SVG (the same resvg GPUI draws SVGs with)
resvg = { version = "0.45", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }
# Mermaid diagrams (src/mermaid.rs): parsed, laid out and written as SVG in
# Rust. Not the default features: those add ELK (EPL-2.0) and every family.
merman = { version = "0.11.0", default-features = false, features = ["svg", "layout-cytoscape", "diagram-flowchart", "diagram-sequence", "diagram-class", "diagram-state", "diagram-er", "diagram-gantt", "diagram-pie", "diagram-mindmap", "diagram-journey", "diagram-timeline", "diagram-git-graph", "diagram-quadrant-chart", "diagram-xychart"] }
# the board's Xiaolai font is stored deflated (src/board/fonts.rs)
miniz_oxide = "0.9"
# 设置's font lists read what each installed family is (src/font_classes.rs)
ttf-parser = "0.25"
minisign-verify = "0.3.0"
sha2 = "0.10.9"
log = "0.4"
sys-locale = "0.3.2"
jpeg-decoder = { version = "0.3", default-features = false }
png = "0.18"
icu_plurals = "2.4.0"
icu_locale_core = "2.4.0"
# 画板's CPU renderer above a scene size (src/board/render_vello.rs), on every
# platform; its frames are shown with GPUI's `Window::paint_pixels`.
vello_cpu = { version = "=0.3.0", default-features = false, features = ["std", "u8_pipeline", "multithreading"] }

# The web build (wasm32, a live demo for the site) runs single-threaded on stable.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
gpui_platform = { path = "vendor/zed/crates/gpui_platform", features = ["font-kit", "wayland", "x11"] }

[target.'cfg(target_family = "wasm")'.dependencies]
gpui_platform = { path = "vendor/zed/crates/gpui_platform", default-features = false }
gpui_web = { path = "vendor/zed/crates/gpui_web", default-features = false }
futures = "0.3"
uuid = { version = "1.28.0", features = ["v4", "js"] }
sys-locale = { version = "0.3.2", features = ["js"] }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "Navigator", "Location", "Document", "Element", "Request", "Response", "Url", "UrlSearchParams"] }
js-sys = "0.3"
wasm-bindgen-futures = "0.4"

# The status bar's colour follows the look (`gpui_ios::ios::set_status_bar_style`).
[target.'cfg(target_os = "ios")'.dependencies]
gpui_ios = { path = "vendor/zed/crates/gpui_ios" }
futures = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.24"
core-foundation = "=0.10.0"
objc = "0.2"

# editor::text::tests drives the macOS text system directly.
[target.'cfg(target_os = "macos")'.dev-dependencies]
gpui_apple = { path = "vendor/zed/crates/gpui_apple", features = ["font-kit"] }

# A window-less text system for the bundled emoji font test (src/editor/emoji.rs)
# and the system font test (src/theme.rs).
[target.'cfg(target_os = "linux")'.dev-dependencies]
gpui_wgpu = { path = "vendor/zed/crates/gpui_wgpu" }
gpui_linux = { path = "vendor/zed/crates/gpui_linux" }

[target.'cfg(target_os = "windows")'.dependencies]
windows-registry = "0.5"
# PDF and printing (printing.rs): WebView2, on the same `windows` as GPUI.
webview2-com = "0.38"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_Memory", "Win32_UI_Controls_Dialogs", "Win32_UI_WindowsAndMessaging"] }

# GPUI is vendored from the Zed repository: an upstream snapshot plus our
# patch series, kept in sync by tools/vendor-sync (vendor/PATCHES.md).

# zed-xim (GPUI's X11 input method client) crashed on any compound text but
# UTF-8 and JIS, such as Rime's GB2312 through IBus (#465): our copy decodes
# all of it and never fails (vendor/xim-ctext/README.md).
[patch.crates-io]
xim-ctext = { path = "vendor/xim-ctext" }

# Shipped packages (scripts/release.sh and the other packaging scripts) build
# with `--profile dist` into target/dist: whole-program LTO and no symbol table,
# a third smaller than `release`. `release` stays the quick everyday build that
# tests, the harness and the preview use. Line tables go to a separate file
# (quiet_md.dSYM, .pdb, .dwp) that release.sh keeps beside the package, so
# the raw addresses a panic logs can still be resolved (src/logging.rs).
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = "symbols"
debug = "line-tables-only"
split-debuginfo = "packed"

# Mermaid (merman and the crates only it pulls in) is built for size: it was
# most of the growth it brought, and still draws a diagram in milliseconds.
# `dist` inherits these. Name@version where another version is shared.
[profile.release.package.arraydeque]
opt-level = "s"
[profile.release.package."base64@0.23.1"]
opt-level = "s"
[profile.release.package."block-buffer@0.12.1"]
opt-level = "s"
[profile.release.package.by_address]
opt-level = "s"
[profile.release.package."const-oid"]
opt-level = "s"
[profile.release.package."cpufeatures@0.3.1"]
opt-level = "s"
[profile.release.package."crypto-common@0.2.2"]
opt-level = "s"
[profile.release.package.cssparser]
opt-level = "s"
[profile.release.package."data-encoding"]
opt-level = "s"
[profile.release.package."digest@0.11.3"]
opt-level = "s"
[profile.release.package.dtoa]
opt-level = "s"
[profile.release.package."dtoa-short"]
opt-level = "s"
[profile.release.package.dugong]
opt-level = "s"
[profile.release.package."dugong-graphlib"]
opt-level = "s"
[profile.release.package."granit-parser"]
opt-level = "s"
[profile.release.package."html5ever@0.40.1"]
opt-level = "s"
[profile.release.package.htmlize]
opt-level = "s"
[profile.release.package."hybrid-array"]
opt-level = "s"
[profile.release.package.json5]
opt-level = "s"
[profile.release.package."lalrpop-util"]
opt-level = "s"
[profile.release.package.manatee]
opt-level = "s"
[profile.release.package."markup5ever@0.40.0"]
opt-level = "s"
[profile.release.package.merman]
opt-level = "s"
[profile.release.package."merman-core"]
opt-level = "s"
[profile.release.package."merman-markup"]
opt-level = "s"
[profile.release.package."merman-model"]
opt-level = "s"
[profile.release.package."merman-render"]
opt-level = "s"
[profile.release.package."merman-theme-contract"]
opt-level = "s"
[profile.release.package."merman-unicode-linebreak"]
opt-level = "s"
[profile.release.package.palette]
opt-level = "s"
[profile.release.package.palette_math]
opt-level = "s"
[profile.release.package.pastey]
opt-level = "s"
[profile.release.package."pulldown-cmark"]
opt-level = "s"
[profile.release.package."quick-xml@0.42.0"]
opt-level = "s"
[profile.release.package."roughr-merman"]
opt-level = "s"
[profile.release.package."ryu-js"]
opt-level = "s"
[profile.release.package.serde_json_canonicalizer]
opt-level = "s"
[profile.release.package."sha2@0.11.2"]
opt-level = "s"
[profile.release.package."string_cache@0.11.0"]
opt-level = "s"
[profile.release.package."tendril@0.5.1"]
opt-level = "s"
[profile.release.package."ucd-trie"]
opt-level = "s"
[profile.release.package.unicase]
opt-level = "s"
[profile.release.package.web_atoms]
opt-level = "s"

# The web demo (web/build.sh): small over fast, then wasm-opt -Oz.
[profile.web]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = "symbols"
debug = false
panic = "abort"

# `objc`'s msg_send! checks `feature = "cargo-clippy"`, which rustc no longer
# knows about.
[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

# Style lints that fight the code's deliberate shape (GPUI closures with
# long types, pixel tables indexed by column, enums of laid-out lines).
[workspace.lints.clippy]
type_complexity = "allow"
too_many_arguments = "allow"
needless_range_loop = "allow"
large_enum_variant = "allow"
field_reassign_with_default = "allow"
wrong_self_convention = "allow"
unusual_byte_groupings = "allow"

[lints]
workspace = true

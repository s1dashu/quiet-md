name: CI

# Pushes to main run only the quick job (clippy for Linux and the Windows cfg, a few
# minutes). The full jobs (tests, packages, self-tests on macOS, Windows and Linux)
# run on pull requests, every night and on workflow_dispatch (run it before a release).
on:
  push:
    branches: [main]
    # Docs-only pushes skip CI. Pull requests run all required check jobs,
    # but skip expensive compilation and packaging if only docs/site files changed.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'site/**'
  pull_request:
  schedule:
    # 07:00 UTC, 03:00 in UTC-4. The agent loop on the maintainer's machine reads it at 10:00.
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Per event, so a push to main never cancels the nightly or a manual full run.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  # Pushes and PRs cancel superseded runs; the nightly and manual full runs always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  quick:
    # GitHub appends the matrix values: "quick (Linux clippy, …)"; a skipped run shows just "quick".
    name: quick
    if: github.event_name == 'push'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux clippy
            target: x86_64-unknown-linux-gnu
          # Type-checks the cfg(windows) code without a Windows runner; it never links.
          - name: Windows cfg clippy
            target: x86_64-pc-windows-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: |
          sudo apt-get update
          if [ "${{ matrix.target }}" = x86_64-pc-windows-gnu ]; then sudo apt-get install -y gcc-mingw-w64-x86-64
          else sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev libfreetype6-dev libwayland-dev libx11-xcb-dev libvulkan-dev libssl-dev; fi
          rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: quick-${{ matrix.target }}
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Debug profile: only type-checks and lints, so it is much faster than check.py's release clippy.
      - name: Clippy
        env:
          # mingw on 22.04 targets an old Windows by default; sqlite needs Vista+ APIs (GetTickCount64).
          CFLAGS_x86_64_pc_windows_gnu: -D_WIN32_WINNT=0x0A00
        run: |
          cargo clippy --workspace --locked --all-targets --target ${{ matrix.target }} -- -D warnings
          cargo clippy --workspace --locked --all-targets --target ${{ matrix.target }} --features devtools -- -D warnings

  # Decides whether the full jobs run: always on PRs and manual runs; the nightly
  # skips when main has not moved since the last nightly that finished.
  gate:
    name: full run gate
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      full: ${{ steps.gate.outputs.full }}
    steps:
      # The query runs on every full run, so manual runs exercise it too; only the nightly acts on it.
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          full=true
          last=$(gh run list --repo "${{ github.repository }}" --workflow ci.yml --event schedule --branch main --status completed -L 20 \
            --json headSha,conclusion --jq '[.[] | select(.conclusion != "cancelled")][0].headSha // ""')
          echo "Last finished nightly: ${last:-none}"
          if [ "${{ github.event_name }}" = schedule ] && [ "$last" = "${{ github.sha }}" ]; then
            full=false; echo "No new commits since the last nightly; skipping."
          fi
          echo "full=$full" >> "$GITHUB_OUTPUT"

  check:
    name: test + clippy
    needs: gate
    if: needs.gate.outputs.full == 'true'
    # Exercise AppKit and Metal on macOS; Windows checks run separately.
    runs-on: macos-15
    timeout-minutes: 90
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for code changes
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANGED=$(gh pr diff ${{ github.event.pull_request.number }} --name-only || true)
            if [ -n "$CHANGED" ] && ! echo "$CHANGED" | grep -q -v -E '^(.*\.md$|docs/|site/)' && ! echo "$CHANGED" | grep -q '^skills/'; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "Only docs/site/markdown changed; skipping build."
            fi
          fi

      # rust-toolchain.toml pins the channel and asks for clippy; rustup
      # installs both here, so local and CI use the same compiler.
      - name: Install toolchain
        if: steps.filter.outputs.skip != 'true'
        run: |
          rustup component add clippy
          rustup target add x86_64-apple-darwin

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.filter.outputs.skip != 'true'
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
          env-vars: MACOSX_DEPLOYMENT_TARGET

      - name: Build application
        if: steps.filter.outputs.skip != 'true'
        run: cargo build --release --locked

      - name: Tests, bundled guides and clippy
        if: steps.filter.outputs.skip != 'true'
        run: scripts/check.sh

      # Both packages share this ARM runner; do not allocate a second Mac job.
      # Ad-hoc CI packages are for validation, not public distribution.
      - name: Package Apple Silicon
        if: steps.filter.outputs.skip != 'true'
        env:
          SIGNING_IDENTITY: '-'
        run: scripts/release.sh

      - name: Cross-compile and package Intel
        if: steps.filter.outputs.skip != 'true'
        env:
          SIGNING_IDENTITY: '-'
          MACOS_TARGET: x86_64-apple-darwin
        run: scripts/release.sh

      - name: Test Intel update validation under Rosetta
        if: steps.filter.outputs.skip != 'true'
        run: |
          sudo softwareupdate --install-rosetta --agree-to-license
          cargo test --release --locked --no-fail-fast --target x86_64-apple-darwin --bin quiet_md update::tests

      # The packages as shipped, end to end (src/selftest.rs): unpacked into a
      # path with spaces and CJK, each runs its built-in scenarios on a
      # temporary library; Intel runs under Rosetta.
      - name: Release self-test of both packages
        if: steps.filter.outputs.skip != 'true'
        run: |
          status=0
          for arch in arm64 x86_64; do
            scripts/self-test-macos.sh dist-release.*/quiet-md-*-macos-$arch-unsigned.zip "self-test/macos-$arch" || status=1
          done
          exit $status

      - name: Upload self-test reports
        if: always() && steps.filter.outputs.skip != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: self-test-macos
          path: |
            self-test/
            !self-test/**/文档库 Library/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload macOS validation packages
        if: steps.filter.outputs.skip != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-validation-packages
          path: |
            dist-release.*/quiet-md-*-macos-*-unsigned.zip
            dist-release.*/quiet-md-*-macos-*-unsigned.zip.sha256
          if-no-files-found: error
          retention-days: 7

  windows-build:
    name: Windows x64 build
    needs: gate
    if: needs.gate.outputs.full == 'true'
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for code changes
        id: filter
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANGED=$(gh pr diff ${{ github.event.pull_request.number }} --name-only || true)
            if [ -n "$CHANGED" ] && ! echo "$CHANGED" | grep -q -v -E '^(.*\.md$|docs/|site/)' && ! echo "$CHANGED" | grep -q '^skills/'; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "Only docs/site/markdown changed; skipping build."
            fi
          fi

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.filter.outputs.skip != 'true'
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install toolchain
        if: steps.filter.outputs.skip != 'true'
        run: rustup component add clippy

      - name: Build and check with Windows SDK
        if: steps.filter.outputs.skip != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw 'Visual Studio C++ tools were not found' }
          Import-Module "$vs/Common7/Tools/Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          & cargo build --release --locked
          if ($LASTEXITCODE -ne 0) { throw 'Windows build failed' }
          & python scripts/check.py
          if ($LASTEXITCODE -ne 0) { throw 'Windows checks failed' }
          & scripts/package-windows.ps1 -Iscc "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Windows packaging failed' }

      # The installer as shipped, end to end (src/selftest.rs): installed
      # silently into a path with spaces and CJK, the app runs its built-in
      # scenarios on a temporary library, then it is uninstalled.
      - name: Release self-test of the installer
        if: steps.filter.outputs.skip != 'true'
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist/windows/unsigned/quiet-md-*-windows-x64-setup.exe | Select-Object -First 1
          & scripts/self-test-windows.ps1 -Installer $setup.FullName -Output self-test/windows-x64
          if ($LASTEXITCODE -ne 0) { throw 'Release self-test failed' }

      - name: Upload self-test report
        if: always() && steps.filter.outputs.skip != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: self-test-windows
          path: |
            self-test/
            !self-test/**/文档库 Library/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Windows installer
        if: steps.filter.outputs.skip != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-x64-package
          path: |
            dist/windows/unsigned/quiet-md-*-windows-x64-setup.exe
            dist/windows/unsigned/quiet-md-*-windows-x64-setup.exe.sha256
          if-no-files-found: error
          retention-days: 14

  linux-build:
    name: Linux x64 build + checks
    needs: gate
    if: needs.gate.outputs.full == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for code changes
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANGED=$(gh pr diff ${{ github.event.pull_request.number }} --name-only || true)
            if [ -n "$CHANGED" ] && ! echo "$CHANGED" | grep -q -v -E '^(.*\.md$|docs/|site/)' && ! echo "$CHANGED" | grep -q '^skills/'; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "Only docs/site/markdown changed; skipping build."
            fi
          fi

      - name: Install dependencies
        if: steps.filter.outputs.skip != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev libfreetype6-dev libwayland-dev libx11-xcb-dev libvulkan-dev libssl-dev python3 imagemagick fonts-noto-core fonts-noto-cjk

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.filter.outputs.skip != 'true'
        with:
          cache-on-failure: true

      - name: Build application
        if: steps.filter.outputs.skip != 'true'
        run: cargo build --release --locked

      - name: Install clippy
        if: steps.filter.outputs.skip != 'true'
        run: rustup component add clippy

      - name: Tests, bundled guides and clippy
        if: steps.filter.outputs.skip != 'true'
        run: python3 scripts/check.py

      # The website's demo (web/README.md) builds the app for wasm32; type-check it so it can't break unnoticed.
      - name: Web (wasm32) check
        if: steps.filter.outputs.skip != 'true'
        run: |
          rustup target add wasm32-unknown-unknown
          cargo check --locked --target wasm32-unknown-unknown --bin quiet_md

      - name: Verify Linux package
        if: steps.filter.outputs.skip != 'true'
        run: scripts/package-linux.sh

      - name: Build and inspect AppImage
        if: steps.filter.outputs.skip != 'true'
        run: scripts/package-appimage.sh

      - name: Upload Linux packages
        if: steps.filter.outputs.skip != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-x86_64-packages
          path: dist/linux/*
          if-no-files-found: error
          retention-days: 14
